<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7f8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <title>BabyLog — 宝宝的每一天，都值得记住</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="mobile-topbar" class="mobile-topbar">
      <button type="button" id="btn-open-sidebar" class="icon-btn" aria-label="打开菜单">☰</button>
      <div id="mobile-topbar-title" class="mobile-topbar-title">BabyLog</div>
    </div>

    <div id="app-backdrop" class="app-backdrop hidden"></div>

    <div id="app-shell" class="app-shell">
      <aside id="app-sidebar" class="app-sidebar">
        <div class="sidebar-header">
          <div class="sidebar-header-text">
            <div class="sidebar-brand">BabyLog</div>
            <div class="sidebar-subtitle">宝宝的每一天，都值得记住</div>
          </div>
          <button
            type="button"
            id="btn-toggle-sidebar-collapse"
            class="icon-btn sidebar-collapse-btn"
            aria-controls="app-sidebar"
            aria-expanded="true"
            aria-label="收起侧栏"
            title="收起侧栏"
          >
            <svg class="sidebar-collapse-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 6l-6 6 6 6"></path>
            </svg>
          </button>
        </div>
        <nav id="module-nav" class="module-nav" aria-label="模块导航">
          <button type="button" class="module-nav-item active" data-module="profile" title="档案">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 19c1.8-3 4.1-4.5 7-4.5s5.2 1.5 7 4.5"></path></svg>
            </span><span class="module-nav-text">档案</span>
          </button>
          <button type="button" class="module-nav-item" data-module="ai" title="AI">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 3l1.5 4.6h4.8L15.8 10l1.5 4.6L12 12.9 6.7 14.6 8.2 10 5.7 7.6h4.8L12 3z"></path><path d="M5 18h14v2H5z" opacity="0.35"></path></svg>
            </span><span class="module-nav-text">AI</span>
          </button>
          <button type="button" class="module-nav-item" data-module="quick-entry" title="记录">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
            </span><span class="module-nav-text">记录</span>
          </button>
          <button type="button" class="module-nav-item" data-module="timeline" title="活动">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v5l3 2"></path></svg>
            </span><span class="module-nav-text">活动</span>
          </button>
          <button type="button" class="module-nav-item" data-module="stats" title="统计">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 19V9"></path><path d="M12 19V5"></path><path d="M19 19v-7"></path><path d="M4 19h16"></path></svg>
            </span><span class="module-nav-text">统计</span>
          </button>
          <button type="button" class="module-nav-item" data-module="vaccine" title="疫苗">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 7l10 10"></path><path d="M6 9l2-2"></path><path d="M16 19l2-2"></path><path d="M13 4l7 7"></path></svg>
            </span><span class="module-nav-text">疫苗</span>
          </button>
          <button type="button" class="module-nav-item" data-module="gallery" title="相册">
            <span class="module-nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="2"></rect><circle cx="9" cy="11" r="1.6"></circle><path d="M20 15l-4-3-4 4-3-2-5 4"></path></svg>
            </span><span class="module-nav-text">相册</span>
          </button>
        </nav>
        <div class="sidebar-tools">
          <div class="sidebar-tools-label" id="theme-toggle-label">主题</div>
          <div class="theme-toggle" role="group" aria-labelledby="theme-toggle-label">
            <button
              type="button"
              class="theme-icon-btn"
              data-theme="system"
              aria-pressed="false"
              aria-label="跟随系统"
              title="跟随系统"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                <path d="M8 20h8"></path>
                <path d="M12 16v4"></path>
              </svg>
            </button>
            <button type="button" class="theme-icon-btn" data-theme="light" aria-pressed="false" aria-label="浅色" title="浅色">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
              </svg>
            </button>
            <button type="button" class="theme-icon-btn" data-theme="dark" aria-pressed="false" aria-label="深色" title="深色">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"></path>
              </svg>
            </button>
          </div>
        </div>
      </aside>

      <main class="app-content">
        <div class="container">
          <section id="module-profile" class="scene module-panel module-profile active">
            <div class="profile-page">
              <div class="profile-hero">
                <div id="profile-avatar-display" class="profile-avatar-lg">宝</div>
                <label class="profile-avatar-edit-label profile-edit-only" for="baby-avatar" title="更换头像">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                </label>
                <input type="file" id="baby-avatar" accept="image/*" class="hidden" />
              </div>

              <div id="profile-summary" class="profile-identity">
                <div class="profile-name-display">宝宝档案</div>
                <div class="profile-age-display">设置生日后显示月龄</div>
              </div>

              <div id="profile-display" class="profile-display">
                <dl class="profile-dl">
                  <div class="profile-dl-item"><dt>昵称</dt><dd id="profile-d-name">—</dd></div>
                  <div class="profile-dl-item"><dt>生日</dt><dd id="profile-d-birth">—</dd></div>
                  <div class="profile-dl-item"><dt>性别</dt><dd id="profile-d-gender">—</dd></div>
                  <div class="profile-dl-item"><dt>血型</dt><dd id="profile-d-blood">—</dd></div>
                </dl>
                <button type="button" class="profile-edit-btn" id="btn-enter-edit">编辑</button>
              </div>

              <form id="profile-form" class="profile-fields profile-edit-only" onsubmit="return false">
                <div class="profile-field-row">
                  <label class="profile-field-label" for="baby-name">昵称</label>
                  <input type="text" id="baby-name" placeholder="小米粒" />
                </div>
                <div class="profile-field-row">
                  <label class="profile-field-label" for="baby-birth">生日</label>
                  <input type="date" id="baby-birth" />
                </div>
                <div class="profile-field-row">
                  <label class="profile-field-label" for="baby-gender">性别</label>
                  <select id="baby-gender">
                    <option value="">选择</option>
                    <option value="boy">男</option>
                    <option value="girl">女</option>
                  </select>
                </div>
                <div class="profile-field-row">
                  <label class="profile-field-label" for="baby-blood">血型</label>
                  <input type="text" id="baby-blood" placeholder="A / B / O / AB" />
                </div>
                <div class="profile-form-actions">
                  <button type="button" class="profile-cancel-btn" id="btn-cancel-edit">取消</button>
                  <button type="button" class="profile-save-btn" id="btn-save-profile">保存</button>
                </div>
              </form>
            </div>
            <span id="profile-showcase-status" class="hidden"></span>
            <button type="button" id="btn-toggle-profile-editor" class="hidden"></button>
            <button type="button" id="btn-clear-avatar" class="hidden"></button>
          </section>

          <section id="module-ai" class="scene module-panel module-ai">
            <section class="ai-workspace">
              <div class="ai-layout">
                <aside class="ai-sessions-panel">
                  <div class="ai-settings">
                    <div class="ai-instruction-title">指令</div>
                    <div class="ai-instruction-compact" id="ai-instruction-compact" title="">
                      <span id="ai-instruction-preview" class="ai-instruction-preview">未设置指令</span>
                      <button type="button" class="ai-instruction-edit-btn" id="btn-edit-ai-instruction" aria-label="编辑 instruction" title="编辑 instruction">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L19.81 7.94l-3.75-3.75L3 17.25z"></path><path d="M14.06 4.19l3.75 3.75"></path></svg>
                      </button>
                    </div>
                  </div>
                  <div class="ai-sessions-head">
                    <span class="section-title ai-sessions-title">会话</span>
                  </div>
                  <div id="ai-module-summary" class="module-summary-bar ai-sessions-summary" aria-label="会话概览"></div>
                  <input type="search" id="ai-session-search" class="ai-session-search" placeholder="搜索会话标题或内容" aria-label="搜索会话" />
                  <div id="ai-session-list" class="ai-session-list" aria-live="polite"></div>
                </aside>
                <div class="ai-chat">
                  <div class="ai-chat-head">
                    <span id="ai-active-session-title" class="ai-active-session-title">当前会话</span>
                    <button type="button" class="ai-chat-head-icon-btn" id="btn-ai-new-session" aria-label="新建会话（Ctrl+Shift+N）" title="新建会话（Ctrl+Shift+N）">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                    </button>
                  </div>
                  <div id="ai-chat-log" class="ai-chat-log" aria-live="polite"></div>
                  <div class="ai-compose">
                    <textarea id="ai-user-input" class="ai-textarea" rows="3" placeholder="输入问题并回车发送（Shift+Enter 换行）"></textarea>
                    <button type="button" id="btn-ai-send" class="ai-send-btn" aria-label="发送消息">
                      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5l14.5-6-6 14.5-1.8-6.7L4 11.5z"></path><path d="M10.7 13.3L18.5 5.5"></path></svg>
                    </button>
                    <div id="ai-status" class="muted-line ai-status-line" aria-live="polite"></div>
                  </div>
                </div>
              </div>
            </section>
          </section>

          <div id="ai-instruction-modal" class="ai-instruction-modal hidden" role="dialog" aria-modal="true" aria-labelledby="ai-instruction-modal-title">
            <div class="ai-instruction-modal-panel">
              <textarea id="ai-instruction" class="ai-textarea ai-instruction" rows="8" placeholder="定义助手角色、回答风格、约束边界和输出格式…"></textarea>
              <div class="ai-instruction-modal-foot">
                <span class="ai-instruction-modal-hint">Esc 取消</span>
                <button type="button" class="ai-instruction-save-btn" id="btn-save-ai-instruction">保存指令</button>
              </div>
            </div>
          </div>

          <section id="module-stats" class="scene module-panel module-stats">
            <header class="module-head">
              <div>
                <h2 class="module-title">统计</h2>
                <p class="module-desc">查看关键指标与趋势。</p>
              </div>
            </header>

            <div class="stats-controls">
              <div class="stats-controls-row">
                <select id="stats-preset" aria-label="统计快捷范围">
                  <option value="7d">最近 7 天</option>
                  <option value="30d">最近 30 天</option>
                  <option value="today">今天</option>
                  <option value="all">全部</option>
                  <option value="custom">自定义</option>
                </select>
                <input type="date" id="stats-start" />
                <input type="date" id="stats-end" />
                <button type="button" class="stats-apply-btn" id="btn-apply-stats">应用</button>
              </div>
              <div class="stats-controls-row stats-controls-secondary">
                <select id="stats-mode" aria-label="展示模式">
                  <option value="cards">卡片</option>
                  <option value="chart">图表</option>
                </select>
                <select id="chart-metric" aria-label="图表指标"></select>
                <select id="chart-range-mode" aria-label="图表范围">
                  <option value="follow">跟随统计范围</option>
                  <option value="7">近 7 天</option>
                  <option value="30">近 30 天</option>
                  <option value="90">近 90 天</option>
                </select>
              </div>
              <span id="stats-range-hint" class="stats-range-hint">最近 7 天</span>
            </div>

            <div id="stats-grid" class="stats-grid"></div>

            <div id="stats-chart-wrap" class="stats-chart-wrap hidden">
              <canvas id="stats-chart" width="900" height="320"></canvas>
              <div id="chart-tooltip" class="chart-tooltip hidden"></div>
              <div class="chart-legend">
                <span class="chart-legend-dot"></span>
                <span id="chart-legend-text">趋势指标</span>
              </div>
            </div>
          </section>

          <section id="module-vaccine" class="scene module-panel module-vaccine">
            <header class="module-head">
              <div>
                <h2 class="module-title">疫苗</h2>
                <p class="module-desc">接种计划与提醒。</p>
              </div>
            </header>

            <div class="vac-controls">
              <div class="vac-controls-row">
                <select id="vaccine-region" aria-label="疫苗地区模板">
                  <option value="cn">中国大陆</option>
                  <option value="who">WHO 扩展</option>
                  <option value="us">美国 CDC</option>
                </select>
                <select id="vaccine-reminder-days" aria-label="提前提醒天数">
                  <option value="0">当天提醒</option>
                  <option value="1">提前 1 天</option>
                  <option value="3">提前 3 天</option>
                  <option value="7">提前 7 天</option>
                </select>
                <button type="button" id="btn-build-vaccine" class="vac-action-btn">生成计划</button>
              </div>
              <div class="vac-controls-aux">
                <button type="button" id="btn-check-vaccine-reminder" class="vac-aux-btn">检查提醒</button>
                <button type="button" id="btn-enable-vaccine-notice" class="vac-aux-btn">通知</button>
                <button type="button" id="btn-toggle-vaccine-editor" class="vac-aux-btn">模板</button>
              </div>
            </div>

            <div id="vaccine-template-editor" class="vac-editor hidden">
              <div class="vac-editor-title">自定义模板</div>
              <input type="text" id="vaccine-template-name" class="vac-editor-input" placeholder="模板名称" />
              <table id="vaccine-template-table" class="vac-table">
                <thead>
                  <tr><th>疫苗名</th><th>剂次</th><th>天数</th><th></th></tr>
                </thead>
                <tbody id="vaccine-template-tbody"></tbody>
              </table>
              <div class="vac-editor-actions">
                <button type="button" id="btn-add-vaccine-row" class="vac-aux-btn">新增行</button>
                <button type="button" id="btn-load-vaccine-template" class="vac-aux-btn">载入当前</button>
                <button type="button" id="btn-save-vaccine-template" class="vac-aux-btn">保存</button>
                <button type="button" id="btn-delete-vaccine-template" class="vac-aux-btn vac-aux-btn--danger">删除</button>
              </div>
            </div>

            <div id="vaccine-reminder-summary" class="vac-reminder-hint"></div>
            <div id="vaccine-module-summary" class="module-summary-bar"></div>
            <ul id="vaccine-list" class="vac-list"></ul>
          </section>

          <section id="module-quick-entry" class="scene module-panel module-quick-entry">
            <header class="module-head">
              <div>
                <h2 class="module-title">快速记录</h2>
                <p class="module-desc">通过分类入口快速新增日常记录，减少重复输入。</p>
              </div>
            </header>
            <div id="quick-module-summary" class="module-summary-bar"></div>
            <section class="panel card-stack quick-entry-workspace">
              <div id="category-grid" class="category-grid"></div>
            </section>
          </section>

          <section id="module-timeline" class="scene module-panel module-timeline">
            <header class="module-head">
              <div>
                <h2 class="module-title">活动</h2>
                <p class="module-desc">回看记录。</p>
              </div>
            </header>

            <div class="tl-controls">
              <select id="filter-category" aria-label="按类型筛选"></select>
              <input type="date" id="filter-day" aria-label="按日期筛选" />
              <div class="tl-controls-aux">
                <button type="button" id="btn-export" class="tl-aux-btn">导出</button>
                <label class="tl-aux-btn">
                  导入
                  <input type="file" id="import-file" accept="application/json" class="hidden" />
                </label>
              </div>
            </div>

            <ul id="timeline" class="timeline" aria-live="polite"></ul>
            <div id="timeline-more-wrap" class="timeline-more-wrap hidden">
              <button type="button" id="btn-more-timeline" class="tl-more-btn">加载更多</button>
            </div>
            <div id="timeline-module-summary" class="module-summary-bar"></div>
          </section>

          <section id="module-gallery" class="scene module-panel module-gallery">
            <header class="module-head">
              <div>
                <h2 class="module-title">照片</h2>
                <p class="module-desc">浏览照片。</p>
              </div>
            </header>
            <div id="photo-gallery-summary" class="gallery-hint"></div>
            <div id="photo-gallery" class="gallery-grid" aria-live="polite"></div>
            <div id="gallery-module-summary" class="module-summary-bar"></div>
          </section>
        </div>
      </main>
    </div>

    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <h2 id="modal-title">记录</h2>
        <form id="modal-form" onsubmit="return false"></form>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modal-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="modal-save">保存</button>
        </div>
      </div>
    </div>

    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="照片预览">
      <button id="lightbox-close" class="lightbox-btn lightbox-close" aria-label="关闭">&times;</button>
      <button id="lightbox-prev" class="lightbox-btn lightbox-prev" aria-label="上一张">&#8249;</button>
      <button id="lightbox-next" class="lightbox-btn lightbox-next" aria-label="下一张">&#8250;</button>
      <img id="lightbox-img" class="lightbox-img" alt="预览" />
      <div id="lightbox-caption" class="lightbox-caption"></div>
    </div>

    <div id="app-toast" class="app-toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.7/dist/purify.min.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
