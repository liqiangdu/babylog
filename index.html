<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f6fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12" />
    <title>BabyLog — 成长记录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top-nav">
      <div class="nav-inner">
        <div class="nav-logo">BabyLog</div>
        <div class="nav-tools">
          <div class="nav-meta">成长记录</div>
          <select id="theme-select" aria-label="主题模式">
            <option value="system">跟随系统</option>
            <option value="light">浅色</option>
            <option value="dark">深色</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-content">
          <h1>记录每一次成长瞬间</h1>
          <p>喝奶、睡眠、尿布、用药、发育与疫苗，一站式管理宝宝日常。</p>
        </div>
      </section>

      <section class="scene">
        <div class="container">
          <section class="panel card-stack">
            <div class="section-title">宝宝信息</div>
            <form id="profile-form" class="inline-form" onsubmit="return false">
              <input type="text" id="baby-name" placeholder="宝宝昵称" />
              <input type="date" id="baby-birth" />
              <select id="baby-gender">
                <option value="">性别</option>
                <option value="boy">男宝宝</option>
                <option value="girl">女宝宝</option>
                <option value="other">未设置</option>
              </select>
              <input type="text" id="baby-blood" placeholder="血型(可选)" />
              <button type="button" class="btn btn-primary" id="btn-save-profile">保存信息</button>
            </form>
            <div id="profile-summary" class="muted-line">尚未填写宝宝信息</div>
          </section>
        </div>
      </section>

      <section class="scene">
        <div class="container">
          <section class="panel card-stack">
            <div class="section-title">数据统计</div>
            <div class="toolbar">
              <input type="date" id="stats-start" />
              <input type="date" id="stats-end" />
              <select id="stats-preset" aria-label="统计快捷范围">
                <option value="custom">自定义范围</option>
                <option value="7d">最近7天</option>
                <option value="30d">最近30天</option>
                <option value="today">今天</option>
                <option value="all">全部</option>
              </select>
              <button type="button" class="text-btn" id="btn-apply-stats">应用范围</button>
            </div>
            <div class="toolbar">
              <select id="stats-mode" aria-label="统计展示模式">
                <option value="cards">卡片模式</option>
                <option value="chart">图表模式</option>
              </select>
          <select id="chart-metric" aria-label="图表指标"></select>
          <select id="chart-range-mode" aria-label="图表范围">
            <option value="follow">跟随上方统计范围</option>
            <option value="7">最近7天</option>
            <option value="30">最近30天</option>
            <option value="90">最近90天</option>
              </select>
            </div>
            <div id="stats-grid" class="stats-grid"></div>
            <div id="stats-chart-wrap" class="stats-chart-wrap hidden">
              <canvas id="stats-chart" width="900" height="320"></canvas>
              <div id="chart-tooltip" class="chart-tooltip hidden"></div>
              <div class="chart-legend">
            <span><i class="dot feed"></i> <span id="chart-legend-text">趋势指标</span></span>
              </div>
            </div>
          </section>
        </div>
      </section>

      <section class="scene">
        <div class="container">
          <section class="panel card-stack">
            <div class="section-title">疫苗计划</div>
            <div class="toolbar">
              <select id="vaccine-region" aria-label="疫苗地区模板">
                <option value="cn">中国大陆计划</option>
                <option value="who">WHO扩展计划</option>
                <option value="us">美国CDC简版</option>
              </select>
              <select id="vaccine-reminder-days" aria-label="提前提醒天数">
                <option value="0">当天提醒</option>
                <option value="1">提前1天</option>
                <option value="3">提前3天</option>
                <option value="7">提前7天</option>
              </select>
              <button type="button" id="btn-build-vaccine" class="text-btn">生成接种计划</button>
              <button type="button" id="btn-check-vaccine-reminder" class="text-btn">检查提醒</button>
              <button type="button" id="btn-enable-vaccine-notice" class="text-btn">启用通知</button>
              <button type="button" id="btn-toggle-vaccine-editor" class="text-btn">编辑模板</button>
            </div>
            <div id="vaccine-template-editor" class="panel hidden">
              <div class="section-title">自定义模板编辑</div>
              <div class="toolbar">
                <input type="text" id="vaccine-template-name" placeholder="模板名称（如 上海儿童接种）" />
              </div>
              <div class="form-row">
                <label>条目（表格化编辑）</label>
                <table id="vaccine-template-table" class="vaccine-table">
                  <thead>
                    <tr>
                      <th>疫苗名</th>
                      <th>剂次</th>
                      <th>天数</th>
                      <th>操作</th>
                    </tr>
                  </thead>
                  <tbody id="vaccine-template-tbody"></tbody>
                </table>
              </div>
              <div class="toolbar">
                <button type="button" id="btn-add-vaccine-row" class="text-btn">新增一行</button>
                <button type="button" id="btn-load-vaccine-template" class="text-btn">载入当前模板</button>
                <button type="button" id="btn-save-vaccine-template" class="text-btn">保存模板</button>
                <button type="button" id="btn-delete-vaccine-template" class="text-btn">删除当前自定义</button>
              </div>
            </div>
            <div id="vaccine-reminder-summary" class="muted-line"></div>
            <ul id="vaccine-list" class="timeline"></ul>
          </section>
        </div>
      </section>

      <section class="scene">
        <div class="container">
          <section class="panel card-stack">
            <div class="section-title">快速记录</div>
            <div id="category-grid" class="category-grid"></div>
          </section>

          <section class="panel card-stack">
            <div class="section-title">时间轴</div>
            <div class="toolbar">
              <select id="filter-category" aria-label="按类型筛选"></select>
              <input type="date" id="filter-day" aria-label="按日期筛选" />
              <button type="button" id="btn-export" class="text-btn">导出 JSON</button>
              <label class="text-btn" style="cursor: pointer">
                导入
                <input type="file" id="import-file" accept="application/json" class="hidden" />
              </label>
            </div>
            <ul id="timeline" class="timeline" aria-live="polite"></ul>
            <div id="timeline-more-wrap" class="timeline-more-wrap hidden">
              <button type="button" id="btn-more-timeline" class="text-btn">更多</button>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal">
        <h2 id="modal-title">记录</h2>
        <form id="modal-form" onsubmit="return false"></form>
        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" id="modal-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="modal-save">保存</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
